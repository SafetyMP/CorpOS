<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CorpOS · control plane</title>
    <style>
      :root {
        --bg: #0a0d14;
        --bg-grad: radial-gradient(1200px 600px at 80% -10%, #131a2b 0%, transparent 60%);
        --panel: #11162080;
        --panel-solid: #121826;
        --panel-2: #161d2c;
        --border: #232c40;
        --border-soft: #1a2233;
        --text: #e8ecf5;
        --muted: #8a94a8;
        --faint: #5c6577;
        --accent: #5b9bff;
        --accent-2: #7c5bff;
        --green: #3fb950;
        --red: #f87171;
        --yellow: #e3b341;
        --purple: #c084fc;
        --cyan: #22d3ee;
        --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
        --shadow: 0 1px 0 rgba(255, 255, 255, 0.03), 0 8px 24px -12px rgba(0, 0, 0, 0.6);
        --radius: 12px;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        background-image: var(--bg-grad);
        background-attachment: fixed;
        color: var(--text);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        font-size: 14px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      /* ── Header ── */
      header {
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 0.75rem 1.5rem;
        border-bottom: 1px solid var(--border);
        background: rgba(10, 13, 20, 0.85);
        backdrop-filter: blur(12px);
        position: sticky;
        top: 0;
        z-index: 10;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .logo {
        width: 28px;
        height: 28px;
        border-radius: 8px;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        display: grid;
        place-items: center;
        color: #060911;
        font-weight: 800;
        font-size: 15px;
        box-shadow: 0 0 18px -2px rgba(91, 155, 255, 0.5);
      }
      .brand small {
        color: var(--muted);
        font-weight: 500;
        margin-left: 0.15rem;
      }
      .header-right {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 0.6rem;
      }

      .badge-pill {
        font-size: 0.74rem;
        padding: 0.28rem 0.6rem;
        border-radius: 999px;
        border: 1px solid var(--border);
        color: var(--muted);
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        font-variant-numeric: tabular-nums;
        background: var(--panel);
      }
      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--muted);
      }
      .dot.live {
        background: var(--green);
        box-shadow: 0 0 8px var(--green);
      }
      .dot.sim {
        background: var(--cyan);
      }
      .dot.bad {
        background: var(--red);
      }
      #conn.ok .dot {
        background: var(--green);
        box-shadow: 0 0 8px var(--green);
      }
      #conn.bad {
        color: var(--red);
        border-color: var(--red);
      }
      #conn.bad .dot {
        background: var(--red);
      }
      .spend-total {
        color: var(--yellow);
        font-weight: 700;
      }

      /* ── Buttons ── */
      button {
        background: var(--accent);
        color: #04101f;
        border: 0;
        border-radius: 8px;
        padding: 0.5rem 0.95rem;
        font: inherit;
        font-weight: 650;
        cursor: pointer;
        transition:
          filter 0.12s,
          transform 0.06s,
          opacity 0.12s;
      }
      button:hover {
        filter: brightness(1.1);
      }
      button:active {
        transform: translateY(1px);
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      button.ghost {
        background: transparent;
        color: var(--text);
        border: 1px solid var(--border);
        font-weight: 550;
      }
      button.ghost:hover {
        background: var(--panel-2);
      }
      button.approve {
        background: var(--green);
        color: #04210f;
      }
      button.reject {
        background: transparent;
        color: var(--red);
        border: 1px solid color-mix(in srgb, var(--red) 45%, transparent);
      }
      button.demo {
        background: linear-gradient(135deg, var(--accent-2), var(--accent));
        color: #fff;
        box-shadow: 0 0 16px -4px var(--accent-2);
      }
      button.demo:disabled {
        box-shadow: none;
      }

      /* ── Layout ── */
      .kpis {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 0.7rem;
        padding: 1rem 1.5rem 0;
      }
      .kpi {
        background: var(--panel);
        border: 1px solid var(--border-soft);
        border-radius: var(--radius);
        padding: 0.7rem 0.85rem;
        box-shadow: var(--shadow);
      }
      .kpi .label {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--faint);
      }
      .kpi .value {
        font-size: 1.45rem;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        margin-top: 0.1rem;
      }
      .kpi .value.green {
        color: var(--green);
      }
      .kpi .value.yellow {
        color: var(--yellow);
      }
      .kpi .value.purple {
        color: var(--purple);
      }

      #demoBanner {
        padding: 0 1.5rem;
      }
      .banner {
        margin-top: 1rem;
        padding: 0.7rem 0.95rem;
        border-radius: var(--radius);
        background: linear-gradient(
          135deg,
          color-mix(in srgb, var(--accent-2) 18%, transparent),
          color-mix(in srgb, var(--accent) 14%, transparent)
        );
        border: 1px solid color-mix(in srgb, var(--accent-2) 40%, var(--border));
        display: flex;
        align-items: center;
        gap: 0.7rem;
        font-size: 0.88rem;
      }
      .banner .spinner {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 2px solid color-mix(in srgb, var(--accent) 30%, transparent);
        border-top-color: var(--accent);
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .banner.done {
        background: color-mix(in srgb, var(--green) 14%, transparent);
        border-color: color-mix(in srgb, var(--green) 40%, var(--border));
      }
      .banner b {
        color: var(--text);
      }

      .shell {
        display: grid;
        grid-template-columns: 360px minmax(0, 1fr);
        gap: 1rem;
        padding: 1rem 1.5rem 2.5rem;
        align-items: start;
      }
      .rail {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        position: sticky;
        top: 76px;
        max-height: calc(100vh - 90px);
        overflow: auto;
        padding-right: 2px;
      }
      .content {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        min-width: 0;
      }

      .card {
        background: var(--panel-solid);
        border: 1px solid var(--border-soft);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
      }
      .card > .body {
        padding: 0.85rem 0.95rem;
      }
      .sec-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--faint);
        padding: 0.6rem 0.95rem 0;
        font-weight: 600;
      }
      .sec-title .count {
        color: var(--muted);
        background: var(--panel-2);
        border: 1px solid var(--border-soft);
        border-radius: 999px;
        padding: 0 0.5rem;
        font-size: 0.68rem;
      }
      .empty {
        color: var(--faint);
        font-style: italic;
        padding: 0.5rem 0;
        font-size: 0.85rem;
      }

      /* ── Compose ── */
      .compose .body {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .compose label {
        font-size: 0.72rem;
        color: var(--faint);
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .compose input,
      .compose textarea,
      .compose select {
        background: var(--bg);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 8px;
        padding: 0.5rem 0.65rem;
        font: inherit;
        width: 100%;
      }
      .compose input:focus,
      .compose textarea:focus,
      .compose select:focus {
        outline: none;
        border-color: var(--accent);
      }
      .compose textarea {
        min-height: 3rem;
        resize: vertical;
      }
      .compose .row {
        display: grid;
        grid-template-columns: 1fr 90px;
        gap: 0.5rem;
      }

      /* ── Approval cards ── */
      .approval {
        border-left: 3px solid var(--yellow);
        padding: 0.75rem 0.95rem;
        border-bottom: 1px solid var(--border-soft);
      }
      .approval:last-child {
        border-bottom: 0;
      }
      .approval .top {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 0.15rem;
      }
      .approval .tool {
        font-family: var(--mono);
        font-weight: 650;
        font-size: 0.85rem;
      }
      .approval .cost {
        margin-left: auto;
        font-size: 0.72rem;
        color: var(--yellow);
        font-weight: 700;
        background: color-mix(in srgb, var(--yellow) 14%, transparent);
        padding: 0.1rem 0.45rem;
        border-radius: 999px;
        font-variant-numeric: tabular-nums;
      }
      .approval .meta {
        color: var(--muted);
        font-size: 0.78rem;
      }
      .approval .reason {
        color: var(--muted);
        font-size: 0.78rem;
        margin: 0.2rem 0 0.5rem;
      }
      .approval .args {
        font-family: var(--mono);
        font-size: 0.72rem;
        color: var(--faint);
        background: var(--bg);
        border-radius: 6px;
        padding: 0.3rem 0.45rem;
        margin: 0.25rem 0 0.55rem;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .approval .actions {
        display: flex;
        gap: 0.5rem;
      }

      /* ── Agent grid ── */
      .agents-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
        gap: 0.7rem;
      }
      .agent {
        background: var(--panel-solid);
        border: 1px solid var(--border-soft);
        border-radius: 10px;
        padding: 0.7rem 0.8rem;
      }
      .agent .head {
        display: flex;
        align-items: center;
        gap: 0.55rem;
      }
      .avatar {
        width: 30px;
        height: 30px;
        border-radius: 8px;
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: 0.85rem;
        color: #060911;
        flex-shrink: 0;
      }
      .agent .name {
        font-weight: 650;
        font-size: 0.88rem;
        line-height: 1.2;
      }
      .agent .role {
        font-size: 0.74rem;
        color: var(--muted);
      }
      .agent .status {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 0.3rem;
        font-size: 0.68rem;
        color: var(--faint);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .agent.busy .status-dot {
        background: var(--purple);
        box-shadow: 0 0 8px var(--purple);
        animation: pulse 1.4s ease-in-out infinite;
      }
      .agent .status-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--green);
      }
      @keyframes pulse {
        50% {
          opacity: 0.35;
        }
      }
      .agent .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 0.22rem;
        margin-top: 0.55rem;
      }
      .chip {
        font-family: var(--mono);
        font-size: 0.68rem;
        background: var(--bg);
        border: 1px solid var(--border-soft);
        color: var(--muted);
        padding: 0.06rem 0.38rem;
        border-radius: 5px;
      }

      /* ── Tasks + feed split ── */
      .split {
        display: grid;
        grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
        gap: 1rem;
        align-items: start;
      }

      .task {
        padding: 0.7rem 0.95rem;
        border-bottom: 1px solid var(--border-soft);
      }
      .task:last-child {
        border-bottom: 0;
      }
      .task .top {
        display: flex;
        align-items: flex-start;
        gap: 0.5rem;
      }
      .task .title {
        font-weight: 600;
        font-size: 0.88rem;
        flex: 1;
        min-width: 0;
      }
      .task .meta {
        color: var(--muted);
        font-size: 0.74rem;
        margin-top: 0.2rem;
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
      }
      .task .meta .sep {
        color: var(--faint);
      }
      .task .output {
        font-size: 0.78rem;
        color: var(--text);
        background: var(--bg);
        border-radius: 6px;
        padding: 0.35rem 0.5rem;
        margin-top: 0.4rem;
        border-left: 2px solid var(--green);
      }
      .task.failed .output {
        border-left-color: var(--red);
        color: var(--red);
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
        font-size: 0.66rem;
        font-weight: 650;
        padding: 0.12rem 0.45rem;
        border-radius: 999px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        font-family: var(--mono);
        white-space: nowrap;
      }
      .s-queued {
        background: #1c2433;
        color: var(--muted);
      }
      .s-assigned {
        background: #11243a;
        color: var(--accent);
      }
      .s-running {
        background: #2a2336;
        color: var(--purple);
      }
      .s-awaiting_approval {
        background: #3a2f12;
        color: var(--yellow);
      }
      .s-succeeded {
        background: #13301c;
        color: var(--green);
      }
      .s-failed {
        background: #3a1313;
        color: var(--red);
      }
      .s-cancelled {
        background: #1c2433;
        color: var(--faint);
      }

      /* ── Feed ── */
      .feed-body {
        max-height: 520px;
        overflow-y: auto;
      }
      .ev {
        font-family: var(--mono);
        font-size: 0.74rem;
        padding: 0.3rem 0.95rem;
        border-bottom: 1px solid var(--border-soft);
        display: grid;
        grid-template-columns: 56px 150px 1fr;
        gap: 0.55rem;
        align-items: baseline;
      }
      .ev time {
        color: var(--faint);
      }
      .ev .type {
        color: var(--accent);
      }
      .ev .payload {
        color: var(--muted);
        white-space: pre-wrap;
        word-break: break-word;
      }
      .ev .payload .src {
        color: var(--faint);
      }
      .ev.t-task\.queued .type {
        color: var(--muted);
      }
      .ev.t-agent\.(started|succeeded|failed) .type {
        color: var(--purple);
      }
      .ev.t-tool\.call .type {
        color: var(--cyan);
      }
      .ev.t-tool\.denied .type,
      .ev.t-task\.failed .type {
        color: var(--red);
      }
      .ev.t-approval\.(requested|approved) .type {
        color: var(--yellow);
      }
      .ev.t-spend\.recorded .type {
        color: var(--green);
      }

      .scroll {
        scrollbar-width: thin;
        scrollbar-color: var(--border) transparent;
      }
      .scroll::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      .scroll::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 8px;
      }

      @media (max-width: 1100px) {
        .kpis {
          grid-template-columns: repeat(3, 1fr);
        }
        .shell {
          grid-template-columns: 1fr;
        }
        .rail {
          position: static;
          max-height: none;
        }
        .split {
          grid-template-columns: 1fr;
        }
      }
      @media (max-width: 640px) {
        .kpis {
          grid-template-columns: repeat(2, 1fr);
        }
        .ev {
          grid-template-columns: 50px 1fr;
        }
        .ev .payload {
          grid-column: 1 / -1;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <div class="logo">a</div>
        CorpOS <small>control plane</small>
      </div>
      <div class="header-right">
        <span class="badge-pill" id="providerPill"
          ><span class="dot sim"></span><span id="providerText">simulation</span></span
        >
        <span class="badge-pill" id="spendBadge">spend <span class="spend-total">$0.00</span></span>
        <span class="badge-pill" id="conn"><span class="dot"></span>connecting…</span>
        <button class="demo" id="demoBtn" type="button">▶ Run demo</button>
      </div>
    </header>

    <div class="kpis" id="kpis">
      <div class="kpi">
        <div class="label">Tasks</div>
        <div class="value" id="k-tasks">0</div>
      </div>
      <div class="kpi">
        <div class="label">Running</div>
        <div class="value purple" id="k-running">0</div>
      </div>
      <div class="kpi">
        <div class="label">Awaiting</div>
        <div class="value yellow" id="k-awaiting">0</div>
      </div>
      <div class="kpi">
        <div class="label">Succeeded</div>
        <div class="value green" id="k-succeeded">0</div>
      </div>
      <div class="kpi">
        <div class="label">Approvals</div>
        <div class="value" id="k-approvals">0</div>
      </div>
      <div class="kpi">
        <div class="label">Agents</div>
        <div class="value" id="k-agents">0</div>
      </div>
    </div>

    <div id="demoBanner"></div>

    <div class="shell">
      <aside class="rail">
        <div class="card compose">
          <div class="sec-title">Compose task</div>
          <form class="body" id="taskForm" autocomplete="off">
            <div>
              <label for="f-title">Title</label>
              <input id="f-title" name="title" placeholder="e.g. Refund for Ada" required />
            </div>
            <div>
              <label for="f-desc">Description</label>
              <textarea
                id="f-desc"
                name="description"
                placeholder="Describe what the agent should do…"
                required
              ></textarea>
            </div>
            <div class="row">
              <div>
                <label for="f-agent">Assign to</label>
                <select id="f-agent" name="assignedTo">
                  <option value="">(auto)</option>
                </select>
              </div>
              <div>
                <label for="f-prio">Priority</label>
                <input id="f-prio" name="priority" type="number" value="0" min="0" max="9" />
              </div>
            </div>
            <button type="submit">Enqueue task</button>
          </form>
        </div>

        <div class="card">
          <div class="sec-title">Pending approvals <span class="count" id="apprCount">0</span></div>
          <div id="approvals">
            <div class="empty" style="padding: 0.85rem 0.95rem">nothing awaiting approval</div>
          </div>
        </div>
      </aside>

      <main class="content">
        <div class="card">
          <div class="sec-title">Agents <span class="count" id="agentCount">0</span></div>
          <div class="body">
            <div class="agents-grid" id="agents"><div class="empty">no agents registered</div></div>
          </div>
        </div>

        <div class="split">
          <div class="card">
            <div class="sec-title">Tasks <span class="count" id="taskCount">0</span></div>
            <div id="tasks">
              <div class="empty" style="padding: 0.85rem 0.95rem">no tasks yet</div>
            </div>
          </div>
          <div class="card">
            <div class="sec-title">Activity feed</div>
            <div class="feed-body scroll" id="feed">
              <div class="empty" style="padding: 0.85rem 0.95rem">waiting for events…</div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script>
      "use strict";
      const $ = (id) => document.getElementById(id);
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
      const stateLabel = (s) => String(s ?? "").replace(/_/g, " ");
      const MAX_EVENTS = 200;

      const KNOWN_TASK_STATES = new Set([
        "pending",
        "assigned",
        "running",
        "awaiting_approval",
        "succeeded",
        "failed",
        "cancelled",
        "unknown",
      ]);

      function safeTaskState(state) {
        const s = String(state ?? "unknown");
        return KNOWN_TASK_STATES.has(s) ? s : "unknown";
      }

      function safeEventTypeClass(type) {
        const slug = String(type ?? "unknown").replace(/[^a-zA-Z0-9_-]/g, "_");
        return "ev t-" + slug;
      }

      function clearEl(el) {
        while (el.firstChild) el.removeChild(el.firstChild);
      }

      function textEl(tag, text, className) {
        const el = document.createElement(tag);
        if (className) el.className = className;
        el.textContent = String(text ?? "");
        return el;
      }

      const AVATAR_COLORS = [
        "#5b9bff",
        "#7c5bff",
        "#3fb950",
        "#e3b341",
        "#22d3ee",
        "#f87171",
        "#c084fc",
      ];
      const TERMINAL = ["succeeded", "failed", "cancelled"];

      let agents = [];
      let pendingTasks = [];
      let pendingApprovals = [];
      let providerId = "simulation";
      let demoRunning = false;

      function wsUrl() {
        const proto = location.protocol === "https:" ? "wss:" : "ws:";
        return proto + "//" + location.host + "/ws";
      }

      function connect() {
        const sock = new WebSocket(wsUrl());
        sock.onopen = () => {
          $("conn").className = "badge-pill ok";
          clearEl($("conn"));
          const dot = document.createElement("span");
          dot.className = "dot";
          $("conn").appendChild(dot);
          $("conn").appendChild(document.createTextNode("connected"));
        };
        sock.onclose = () => {
          $("conn").className = "badge-pill bad";
          clearEl($("conn"));
          const dot = document.createElement("span");
          dot.className = "dot";
          $("conn").appendChild(dot);
          $("conn").appendChild(document.createTextNode("reconnecting…"));
          setTimeout(connect, 1500);
        };
        sock.onerror = () => {
          try {
            sock.close();
          } catch (e) {}
        };
        sock.onmessage = (ev) => {
          let msg;
          try {
            msg = JSON.parse(ev.data);
          } catch (e) {
            return;
          }
          if (msg.type === "snapshot" && msg.payload) {
            agents = msg.payload.agents || [];
            pendingTasks = msg.payload.tasks || [];
            pendingApprovals = msg.payload.approvals || [];
            if (msg.payload.provider) setProvider(msg.payload.provider);
            renderAll();
          } else {
            appendEvent(msg);
            scheduleRefresh();
          }
        };
      }

      let refreshTimer = null;
      function scheduleRefresh() {
        if (refreshTimer) return;
        refreshTimer = setTimeout(() => {
          refreshTimer = null;
          void refreshState();
        }, 200);
      }

      async function refreshState() {
        try {
          const [tasks, approvals] = await Promise.all([
            fetch("/api/tasks").then((r) => r.json()),
            fetch("/api/approvals").then((r) => r.json()),
          ]);
          pendingTasks = tasks || [];
          pendingApprovals = approvals || [];
          renderAll();
        } catch (e) {}
      }

      function setProvider(id) {
        providerId = id || "simulation";
        const live = providerId !== "simulation";
        $("providerText").textContent = live ? "live · " + providerId : "simulation";
        $("providerPill").querySelector(".dot").className = "dot " + (live ? "live" : "sim");
      }

      function renderAll() {
        renderAgents();
        renderTasks();
        renderApprovals();
        renderKpis();
        renderAgentSelect();
      }

      function renderKpis() {
        const byState = new Map();
        for (const t of pendingTasks) {
          const st = safeTaskState(t.state);
          byState.set(st, (byState.get(st) || 0) + 1);
        }
        $("k-tasks").textContent = pendingTasks.length;
        $("k-running").textContent = (byState.get("running") || 0) + (byState.get("assigned") || 0);
        $("k-awaiting").textContent = byState.get("awaiting_approval") || 0;
        $("k-succeeded").textContent = byState.get("succeeded") || 0;
        $("k-approvals").textContent = pendingApprovals.length;
        $("k-agents").textContent = agents.length;
        $("agentCount").textContent = agents.length;
        $("taskCount").textContent = pendingTasks.length;
        $("apprCount").textContent = pendingApprovals.length;
      }

      function renderAgentSelect() {
        const sel = $("f-agent");
        const cur = sel.value;
        clearEl(sel);
        const autoOpt = document.createElement("option");
        autoOpt.value = "";
        autoOpt.textContent = "(auto)";
        sel.appendChild(autoOpt);
        for (const a of agents) {
          const opt = document.createElement("option");
          opt.value = String(a.id ?? "");
          opt.textContent = String(a.name ?? "") + " · " + String(a.role ?? "");
          sel.appendChild(opt);
        }
        if ([...sel.options].some((o) => o.value === cur)) sel.value = cur;
      }

      function busyAgentIds() {
        const set = new Set();
        for (const t of pendingTasks) {
          if (t.assignedTo && !TERMINAL.includes(safeTaskState(t.state))) set.add(t.assignedTo);
        }
        return set;
      }

      function renderAgents() {
        const root = $("agents");
        if (!agents.length) {
          renderEmpty(root, "no agents registered");
          return;
        }
        clearEl(root);
        const busy = busyAgentIds();
        agents.forEach((a, i) => {
          const card = document.createElement("div");
          card.className = "agent" + (busy.has(a.id) ? " busy" : "");
          const head = document.createElement("div");
          head.className = "head";
          const avatar = document.createElement("div");
          avatar.className = "avatar";
          avatar.style.background = AVATAR_COLORS[i % AVATAR_COLORS.length];
          avatar.textContent = String(a.name || a.id || "?")
            .trim()
            .charAt(0)
            .toUpperCase();
          const meta = document.createElement("div");
          meta.appendChild(textEl("div", a.name, "name"));
          meta.appendChild(textEl("div", a.role, "role"));
          const status = document.createElement("div");
          status.className = "status";
          const statusDot = document.createElement("span");
          statusDot.className = "status-dot";
          status.appendChild(statusDot);
          status.appendChild(document.createTextNode(busy.has(a.id) ? "busy" : "idle"));
          head.appendChild(avatar);
          head.appendChild(meta);
          head.appendChild(status);
          const chips = document.createElement("div");
          chips.className = "chips";
          for (const tool of a.tools || []) {
            chips.appendChild(textEl("span", tool, "chip"));
          }
          card.appendChild(head);
          card.appendChild(chips);
          root.appendChild(card);
        });
      }

      function renderEmpty(parent, message, className, style) {
        clearEl(parent);
        const el = textEl("div", message, className || "empty");
        if (style) el.setAttribute("style", style);
        parent.appendChild(el);
      }

      function renderTasks() {
        const root = $("tasks");
        if (!pendingTasks.length) {
          renderEmpty(root, "no tasks yet", "empty", "padding:0.85rem 0.95rem");
          return;
        }
        clearEl(root);
        const list = pendingTasks.slice().reverse();
        for (const t of list) {
          const state = safeTaskState(t.state);
          const card = document.createElement("div");
          card.className = "task" + (state === "failed" ? " failed" : "");
          const top = document.createElement("div");
          top.className = "top";
          top.appendChild(textEl("span", stateLabel(state), "badge s-" + state));
          top.appendChild(textEl("div", t.title, "title"));
          card.appendChild(top);
          const meta = document.createElement("div");
          meta.className = "meta";
          if (t.assignedTo) {
            meta.appendChild(document.createTextNode("→ " + String(t.assignedTo)));
          } else {
            meta.appendChild(textEl("span", "unassigned"));
          }
          meta.appendChild(textEl("span", "·", "sep"));
          meta.appendChild(textEl("span", "prio " + String(t.priority ?? "")));
          meta.appendChild(textEl("span", "·", "sep"));
          meta.appendChild(textEl("span", String((t.createdAt || "").slice(11, 19))));
          if (t.attempts > 1) {
            meta.appendChild(textEl("span", "·", "sep"));
            meta.appendChild(textEl("span", "try " + String(t.attempts)));
          }
          card.appendChild(meta);
          if (t.output && t.output.summary) {
            const summary = String(t.output.summary);
            const clipped = summary.slice(0, 200) + (summary.length > 200 ? "…" : "");
            card.appendChild(textEl("div", clipped, "output"));
          } else if (t.error) {
            card.appendChild(textEl("div", t.error, "output"));
          }
          root.appendChild(card);
        }
      }

      function renderApprovals() {
        const root = $("approvals");
        if (!pendingApprovals.length) {
          renderEmpty(root, "nothing awaiting approval", "empty", "padding:0.85rem 0.95rem");
          return;
        }
        clearEl(root);
        for (const a of pendingApprovals) {
          const card = document.createElement("div");
          card.className = "approval";
          card.dataset.id = String(a.id ?? "");
          const top = document.createElement("div");
          top.className = "top";
          top.appendChild(textEl("span", a.tool, "tool"));
          if (a.cost) {
            top.appendChild(
              textEl(
                "span",
                "$" + Number(a.cost.amount).toFixed(2) + " " + String(a.cost.currency ?? ""),
                "cost",
              ),
            );
          }
          card.appendChild(top);
          card.appendChild(
            textEl(
              "div",
              "agent " + String(a.agentId ?? "") + " · task " + String((a.taskId || "").slice(-6)),
              "meta",
            ),
          );
          card.appendChild(textEl("div", JSON.stringify(a.args ?? {}), "args"));
          card.appendChild(textEl("div", a.reason, "reason"));
          const actions = document.createElement("div");
          actions.className = "actions";
          const approveBtn = document.createElement("button");
          approveBtn.className = "approve";
          approveBtn.dataset.decision = "approved";
          approveBtn.textContent = "Approve";
          const rejectBtn = document.createElement("button");
          rejectBtn.className = "reject";
          rejectBtn.dataset.decision = "rejected";
          rejectBtn.textContent = "Reject";
          actions.appendChild(approveBtn);
          actions.appendChild(rejectBtn);
          card.appendChild(actions);
          root.appendChild(card);
        }
      }

      $("approvals").addEventListener("click", async (e) => {
        const btn = e.target.closest("button[data-decision]");
        if (!btn) return;
        const card = btn.closest("[data-id]");
        if (!card) return;
        const id = card.getAttribute("data-id");
        const decision = btn.getAttribute("data-decision");
        btn.disabled = true;
        try {
          await fetch("/api/approvals/" + encodeURIComponent(id) + "/decide", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ decision, by: "dashboard" }),
          });
        } finally {
          await refreshState();
        }
      });

      $("taskForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const assignedTo = (fd.get("assignedTo") || "").trim();
        const body = {
          title: fd.get("title"),
          description: fd.get("description"),
          priority: Number(fd.get("priority") || 0),
        };
        if (assignedTo) body.assignedTo = assignedTo;
        const res = await fetch("/api/tasks", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify(body),
        });
        if (res.ok) e.target.reset();
        await refreshState();
      });

      function appendEvent(msg) {
        const feed = $("feed");
        const placeholder = feed.querySelector(".empty");
        if (placeholder) placeholder.remove();
        const node = document.createElement("div");
        node.className = safeEventTypeClass(msg.type);
        node.appendChild(textEl("time", (msg.ts || "").slice(11, 19)));
        node.appendChild(textEl("span", msg.type, "type"));
        const payloadWrap = document.createElement("span");
        payloadWrap.className = "payload";
        payloadWrap.appendChild(textEl("span", msg.source || "", "src"));
        payloadWrap.appendChild(document.createTextNode(" " + JSON.stringify(msg.payload ?? {})));
        node.appendChild(payloadWrap);
        feed.insertBefore(node, feed.firstChild);
        while (feed.children.length > MAX_EVENTS) feed.removeChild(feed.lastChild);
      }

      async function pollSpend() {
        try {
          const s = await fetch("/api/spend").then((r) => r.json());
          const total = Number(s.total || 0).toFixed(2);
          const badge = $("spendBadge");
          clearEl(badge);
          badge.appendChild(document.createTextNode("spend "));
          badge.appendChild(textEl("span", "$" + total, "spend-total"));
        } catch (e) {}
      }

      // ── Demo mode ──────────────────────────────────────────────
      // Posts a curated multi-agent scenario and auto-approves every gate so
      // the full policy-gated loop is visible without manual steps. Works in
      // both live and simulation mode (deterministic in simulation).
      const DEMO_TASKS = [
        {
          title: "Refund for Ada Lovelace",
          description:
            "Ada (ada@example.com) wants a $49 refund on her Pro subscription (sub_ada_pro). Verify the 30-day policy and her account, then process the refund and notify her.",
          assignedTo: "agent_support",
          priority: 2,
        },
        {
          title: "Checkout service degraded",
          description:
            "checkout-api is returning elevated 500s. Diagnose health, review alerts, and restart the service if needed.",
          assignedTo: "agent_ops",
          priority: 3,
        },
        {
          title: "Apply goodwill credit",
          description:
            "Grace (grace@example.com, Team plan) experienced downtime. Apply a $25 goodwill credit to her subscription.",
          assignedTo: "agent_finance",
          priority: 1,
        },
        {
          title: "Follow up on Team expansion",
          description:
            "Grace Hopper's Team plan expansion deal is in negotiation. Review open deals and follow up with her.",
          assignedTo: "agent_sales",
          priority: 1,
        },
        {
          title: "Investigate search latency",
          description:
            "search-api latency is spiking. Check system health and decide whether engineering action is needed.",
          assignedTo: "agent_engineer",
          priority: 2,
        },
      ];

      function setBanner(message, done) {
        const host = $("demoBanner");
        clearEl(host);
        const div = document.createElement("div");
        div.className = "banner" + (done ? " done" : "");
        if (!done) {
          const spinner = document.createElement("span");
          spinner.className = "spinner";
          div.appendChild(spinner);
        }
        div.appendChild(document.createTextNode(message));
        host.appendChild(div);
      }
      function clearBanner() {
        clearEl($("demoBanner"));
      }

      async function postTask(t) {
        await fetch("/api/tasks", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify(t),
        });
      }
      async function approve(id) {
        await fetch("/api/approvals/" + encodeURIComponent(id) + "/decide", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ decision: "approved", by: "demo" }),
        });
      }

      async function runDemo() {
        if (demoRunning) return;
        demoRunning = true;
        const btn = $("demoBtn");
        btn.disabled = true;
        btn.textContent = "● running…";
        const live = providerId !== "simulation";
        try {
          setBanner(
            "Starting demo — enqueuing " +
              DEMO_TASKS.length +
              " tasks across all agents (" +
              (live ? "live · " + providerId : "simulation") +
              "). Approvals will be auto-resolved.",
          );
          for (let i = 0; i < DEMO_TASKS.length; i++) {
            await postTask(DEMO_TASKS[i]);
            setBanner(
              "Enqueued " + (i + 1) + "/" + DEMO_TASKS.length + " tasks. Watching agents reason…",
            );
            await sleep(900);
          }
          // Drain approval gates, auto-resolving each so the demo progresses.
          const deadline = Date.now() + 150000;
          while (Date.now() < deadline) {
            await refreshState();
            const pending = pendingApprovals.slice();
            if (pending.length) {
              for (const a of pending) {
                setBanner(
                  "Auto-approving " +
                    String(a.tool ?? "") +
                    (a.cost ? " ($" + Number(a.cost.amount).toFixed(0) + ")" : "") +
                    " requested by " +
                    String(a.agentId ?? "") +
                    "…",
                );
                await sleep(1100);
                await approve(a.id);
                await sleep(500);
              }
            } else {
              const active = pendingTasks.filter((t) => !TERMINAL.includes(t.state));
              if (active.length === 0) break;
              setBanner(active.length + " task(s) still in progress…");
            }
            await sleep(900);
          }
          const ok = pendingTasks.filter((t) => t.state === "succeeded").length;
          const spend = await fetch("/api/spend")
            .then((r) => r.json())
            .catch(() => ({ total: 0 }));
          setBanner(
            "Demo complete — " +
              ok +
              "/" +
              DEMO_TASKS.length +
              " tasks succeeded, $" +
              Number(spend.total || 0).toFixed(2) +
              " spend recorded. Review the activity feed for the full event trace.",
            true,
          );
        } catch (e) {
          setBanner("Demo stopped: " + String(e.message || e), true);
        } finally {
          demoRunning = false;
          btn.disabled = false;
          btn.textContent = "▶ Run demo";
        }
      }

      $("demoBtn").addEventListener("click", runDemo);

      // boot
      fetch("/api/health")
        .then((r) => r.json())
        .then((h) => setProvider(h.provider))
        .catch(() => {});
      setInterval(pollSpend, 5000);
      pollSpend();
      connect();
    </script>
  </body>
</html>
