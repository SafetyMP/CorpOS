# Fly.io config. Deploy with:
#   flyctl launch --image ghcr.io/safelymp/corpos:0.1.0   (use the published image)
#   flyctl deploy                                            (build from the Dockerfile)
# Or via the deploy.yml workflow with FLY_API_TOKEN set.
# NOTE: choose a globally-unique app name (flyctl apps create).

app = "corpos"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [http_service.checks]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

# Simulation-first: with no secret set the app boots and the demo runs.
# Set the secret for live agents: flyctl secrets set OPENROUTER_API_KEY=sk-or-...
[env]
  LOG_LEVEL = "info"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
