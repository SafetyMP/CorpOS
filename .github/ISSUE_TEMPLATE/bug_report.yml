name: Bug Report
description: Report a defect, harness failure, or demo regression
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Include commands you ran and their output when possible.
        CorpOS is a reference implementation — see [SECURITY.md](https://github.com/SafetyMP/CorpOS/blob/main/SECURITY.md).

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the bug
      placeholder: Company day fails with exception settle not recorded...
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - packages/core (firm / policy / company day)
        - packages/mcp-knowledge
        - apps/api
        - apps/console
        - harness / CI
        - docs
        - Other
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Commands or workflow steps
      placeholder: |
        1. npm install && npm run build
        2. npm run scenario
        3. …
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: Paste relevant stderr, CI link, or JSON result
      render: shell

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Local (npm run dev / start)
        - Docker
        - GitHub Actions CI
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Branch, commit, or release tag
      placeholder: main, abc1234
